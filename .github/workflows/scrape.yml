name: twidouga scraper

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: twidouga-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # CPU moderation processes every sensitive candidate before publication.
    # The concurrency group prevents overlap with the next scheduled run.
    timeout-minutes: 120

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: error
        options: >-
          --health-cmd "curl -sf http://localhost:8191/health || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Checkout xfeed
        uses: actions/checkout@v4
        with:
          repository: kyo8n0629-creator/xfeed
          token: ${{ secrets.GH_PAT }}
          path: xfeed

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: xfeed/twidouga-scraper/package-lock.json

      - name: Set up Python for moderation
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install scraper dependencies
        working-directory: xfeed/twidouga-scraper
        run: npm ci

      - name: Install xfeed dependencies
        working-directory: xfeed
        run: npm ci

      - name: Validate Cloudflare D1 credentials
        working-directory: xfeed
        env:
          CF_D1_TOKEN:   ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: 9800dca5f80c177137de83829aa43bdc
        run: |
          set -euo pipefail
          if [ -z "$CF_D1_TOKEN" ]; then
            echo "CLOUDFLARE_D1_API_TOKEN (or CLOUDFLARE_API_TOKEN) is not configured in twidouga-scraper Actions Secrets." >&2
            exit 1
          fi
          if ! printf '%s' "$CF_ACCOUNT_ID" | grep -Eq '^[0-9a-fA-F]{32}$'; then
            echo "CLOUDFLARE_ACCOUNT_ID is missing or invalid. Set the 32-character Cloudflare Account ID for the account that owns xfeed-db." >&2
            exit 1
          fi
          http_code="$(curl --silent --show-error --output /tmp/xfeed-d1-auth.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $CF_D1_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database/8c5aa71b-3a81-4a5c-8c2e-8d9a7ac51be2")"
          if [ "$http_code" != "200" ]; then
            api_errors="$(node -e "const fs=require('fs'); try { const x=JSON.parse(fs.readFileSync('/tmp/xfeed-d1-auth.json','utf8')); console.log((x.errors||[]).map(e=>e.code+':'+e.message).join(' | ')||'no API error details'); } catch { console.log('unparseable API response'); }")"
            echo "Cloudflare D1 credential check failed with HTTP $http_code ($api_errors). Confirm CLOUDFLARE_ACCOUNT_ID is the 32-character Account ID, not the D1 database ID, and that the token belongs to the same account with Account > D1 > Edit." >&2
            exit 1
          fi
          echo "Cloudflare D1 credentials verified for the configured database."

      # Schema migrations are intentionally not run by the hourly scraper.
      # They are one-time deployment operations; running them here makes every
      # scrape depend on migration permissions and can block publication.

      - name: Download current cache from R2
        working-directory: xfeed
        run: npm run download:cache:r2
        env:
          CLOUDFLARE_API_TOKEN:     ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:    9800dca5f80c177137de83829aa43bdc
          CACHE_SOURCE_ARCHIVE_KEY: cache-source/videos-full.json
          CACHE_SOURCE_DELTA_KEY:   cache-source/scraped-delta.json
          CACHE_DOWNLOAD_PAGED:     "0"

      - name: Run DB-free scraper
        working-directory: xfeed/twidouga-scraper
        env:
          FLARESOLVERR_URL:          http://localhost:8191
          SCRAPER_OUTPUT_FILE:       scraped-videos.json
          SCRAPER_MAX_PER_RUN:       "20"
          SCRAPER_INTERVAL_MS:       "1000"
          SCRAPER_FAIL_ON_NO_VIDEOS: "0"
          EXISTING_CACHE_FILES: ../data/cache-source-base.json,../data/cache-source-delta.json,../public/cache/latest.json,../public/cache/home-feed.json,../public/cache/ranking-alltime.json
        run: |
          for attempt in 1 2 3; do
            if node cache-scraper.cjs; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "scraper failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "scraper attempt ${attempt} failed; retrying with checkpoint" >&2
            sleep $((attempt * 10))
          done

      - name: Check whether Model-1 inference is needed
        id: model1_sensitive
        working-directory: xfeed
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / 'twidouga-scraper'))
          from model1_moderation import is_non_japanese_title

          input_path = Path('twidouga-scraper/scraped-videos.json')
          payload = json.loads(input_path.read_text(encoding='utf-8-sig'))
          rows = payload if isinstance(payload, list) else payload.get('videos', [])
          if not isinstance(rows, list) or any(not isinstance(row, dict) for row in rows):
              raise ValueError('Scraper output must be an array of video objects')
          model_rows = [row for row in rows
                        if row.get('is_sensitive') is not False and not is_non_japanese_title(row)]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('has_sensitive={}\n'.format(bool(model_rows)))
          print('[model1] sensitive rows requiring inference: {}'.format(len(model_rows)))
          PY

      # Non-Japanese titles are excluded by the Model-1 gate. Only CENSORED
      # outcomes enter the public output; UNCENSORED and REVIEW stay private.
      - name: Download Model-1 weights from R2
        if: steps.model1_sensitive.outputs.has_sensitive == 'true'
        working-directory: xfeed
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9800dca5f80c177137de83829aa43bdc
        run: |
          mkdir -p model1-artifacts/models/nudenet model1-artifacts/models
          npx wrangler r2 object get xfeed-cache/moderation/model1/fc3b0a039d96f1b62518599320c528ae9514e8050bf633dfefe605edf6817929/models/nudenet/320n.onnx --remote --file model1-artifacts/models/nudenet/320n.onnx
          npx wrangler r2 object get xfeed-cache/moderation/model1/fc3b0a039d96f1b62518599320c528ae9514e8050bf633dfefe605edf6817929/models/lada_mosaic_detection_model_v4_fast.pt --remote --file model1-artifacts/models/lada_mosaic_detection_model_v4_fast.pt

      - name: Install pinned CPU inference dependencies
        if: steps.model1_sensitive.outputs.has_sensitive == 'true'
        working-directory: xfeed
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r video_moderation_v2/model1_scraper/requirements.txt
          python -m pip check

      - name: Verify Model-1 source and weight hashes
        if: steps.model1_sensitive.outputs.has_sensitive == 'true'
        working-directory: xfeed
        run: >-
          python video_moderation_v2/model1_scraper/verify_artifacts.py
          --root video_moderation_v2/backups/Model-1
          --artifact-root model1-artifacts

      - name: Moderate scraped videos with Model-1
        working-directory: xfeed
        run: >-
          python twidouga-scraper/moderation-gate.py
          --input twidouga-scraper/scraped-videos.json
          --public-output twidouga-scraper/scraped-videos-public.json
          --review-output twidouga-scraper/scraped-videos-review.json
          --engine model1
          --model1-artifact-root model1-artifacts

      - name: Synchronize moderation decisions to D1
        # This is the authoritative workflow. Always persist the gate result;
        # a missing variable must never silently skip D1 synchronization.
        working-directory: xfeed
        run: |
          for attempt in 1 2 3; do
            if node scripts/import-moderated-scraped-to-d1.js; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "D1 import failed after ${attempt} attempts; refusing publication" >&2
              exit 1
            fi
            echo "D1 import attempt ${attempt} failed; retrying" >&2
            sleep $((attempt * 15))
          done
        env:
          SCRAPER_PUBLIC_OUTPUT: twidouga-scraper/scraped-videos-public.json
          SCRAPER_REVIEW_OUTPUT: twidouga-scraper/scraped-videos-review.json
          D1_DATABASE_NAME:       xfeed-db
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9800dca5f80c177137de83829aa43bdc

      - name: Verify moderation labels in D1
        working-directory: xfeed
        run: node scripts/verify-moderated-scraped-d1.js
        env:
          SCRAPER_PUBLIC_OUTPUT: twidouga-scraper/scraped-videos-public.json
          SCRAPER_REVIEW_OUTPUT: twidouga-scraper/scraped-videos-review.json
          D1_DATABASE_NAME:       xfeed-db
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9800dca5f80c177137de83829aa43bdc

      - name: Upload moderation review queue
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraped-videos-review
          path: xfeed/twidouga-scraper/scraped-videos-review.json
          if-no-files-found: error

      - name: Upload scraper recovery artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-recovery-output
          path: |
            xfeed/twidouga-scraper/scraped-videos.json
            xfeed/twidouga-scraper/scraped-videos-public.json
            xfeed/twidouga-scraper/scraped-videos-review.json
            xfeed/data/d1-import/moderated-scraped-videos.sql
          if-no-files-found: ignore

      - name: Merge scraped videos into cache input
        working-directory: xfeed
        run: npm run merge:scraped:cache
        env:
          SCRAPER_PUBLIC_OUTPUT: twidouga-scraper/scraped-videos-public.json
          CACHE_SOURCE_FILE:   data/cache-source-merged.json
          CACHE_MERGE_INPUTS:  data/cache-source-base.json,data/cache-source-delta.json,public/cache/latest.json,public/cache/home-feed.json,public/cache/ranking-alltime.json,public/cache/long.json,public/cache/dance.json
          MIN_EXISTING_CACHE_ROWS: "1000"

      - name: Build published moderation dashboard index
        working-directory: xfeed
        run: npm run build:scraper-moderation-index
        env:
          CACHE_SOURCE_FILE: data/cache-source-merged.json
          SCRAPER_REVIEW_INPUT: twidouga-scraper/scraped-videos-review.json

      - name: Synchronize human review decisions into cache input
        id: human_reviews
        # This reads D1. Enable only after CLOUDFLARE_API_TOKEN has Account
        # > D1 > Edit permission; R2-only tokens must still be able to publish.
        if: ${{ vars.ENABLE_SCRAPER_D1_SYNC == '1' }}
        working-directory: xfeed
        run: npm run sync:human-reviews:cache
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9800dca5f80c177137de83829aa43bdc

      - name: Write cache source delta
        working-directory: xfeed
        run: npm run write:cache-delta
        env:
          CACHE_SOURCE_BASE_FILE:  data/cache-source-base.json
          CACHE_SOURCE_FILE:       data/cache-source-merged.json
          CACHE_SOURCE_DELTA_FILE: data/cache-source-delta.json

      - name: Upload cache source delta to R2
        working-directory: xfeed
        run: npm run upload:cache-source:r2
        env:
          CLOUDFLARE_API_TOKEN:     ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:    9800dca5f80c177137de83829aa43bdc
          CACHE_SOURCE_FILE:        data/cache-source-delta.json
          CACHE_SOURCE_ARCHIVE_KEY: cache-source/scraped-delta.json
          R2_UPLOAD_RETRIES:        "3"

      - name: Persist reviewed cache source to R2
        if: steps.human_reviews.outputs.changed == 'true'
        working-directory: xfeed
        run: npm run upload:cache-source:r2
        env:
          CLOUDFLARE_API_TOKEN:     ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:    9800dca5f80c177137de83829aa43bdc
          CACHE_SOURCE_FILE:        data/cache-source-merged.json
          CACHE_SOURCE_ARCHIVE_KEY: cache-source/videos-full.json
          R2_UPLOAD_RETRIES:        "4"

      - name: Rebuild cache without DB
        working-directory: xfeed
        run: npm run build:cache
        env:
          CACHE_SOURCE_FILE:       data/cache-source-merged.json
          CACHE_MAX_ITEMS:         "10000"
          CACHE_LATEST_MAX_ITEMS:  "0"
          CACHE_LONG_MAX_ITEMS:    "0"
          CACHE_HOME_ITEMS:        "1000"
          CACHE_LATEST_PAGE_SIZE:  "200"

      - name: Upload hot cache to R2
        working-directory: xfeed
        run: npm run upload:cache:r2
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9800dca5f80c177137de83829aa43bdc
          UPLOAD_CACHE_SCOPE:     hot
          UPLOAD_HOT_PAGE_LIMIT:  "3"
          R2_SKIP_ENABLE_CHECK:   "1"
          R2_UPLOAD_RETRIES:      "3"

      - name: Publish all cache pages after reviewed releases
        if: steps.human_reviews.outputs.changed == 'true'
        working-directory: xfeed
        run: npm run upload:cache:r2
        env:
          CLOUDFLARE_API_TOKEN:     ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID:    9800dca5f80c177137de83829aa43bdc
          UPLOAD_CACHE_SCOPE:       all
          R2_UPLOAD_CONCURRENCY:    "4"
          R2_SKIP_ENABLE_CHECK:     "1"
          R2_UPLOAD_RETRIES:        "4"
